# Cấu hình Nginx Reverse Proxy cho Frappe LMS trên Azure
# Thay thế "lms.yourdomain.com" bằng tên miền thực tế của bạn

server {
    listen 80;
    server_name lms.yourdomain.com;

    # Kích thước tải tệp tối đa (video, bài giảng, tài liệu)
    client_max_body_size 100M;

    # Log truy cập và lỗi
    access_log /var/log/nginx/lms_access.log;
    error_log /var/log/nginx/lms_error.log;

    # Gzip nén dữ liệu giúp tải trang nhanh hơn qua mạng VN
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Chuyển tiếp toàn bộ request vào container Frappe LMS
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Socket.IO / Thông báo realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tăng timeout tránh ngắt kết nối khi học sinh làm bài thi / tải tệp
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Hỗ trợ đường dẫn Socket.IO riêng biệt
    location /socket.io {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
